<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request confirmation | SERVPRO</title>
  <meta name="theme-color" content="#006341" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="page">
  <header class="nav liquid-glass" style="background:#006341">
    <a class="brand" href="/"><span class="brand-mark">S</span> SERVPRO</a>
  </header>
  <section class="section" style="padding-top:110px">
    <p class="notice">Mock checkout — no real payment is processed. This is an independent design study.</p>
    <h2>Review request</h2>
    <p>Emergency dispatch request. Card on file is used only to hold a dispatch reservation in this mock.</p>
    <form action="/book/success.html" method="get">
      <label>Name on card <input required /></label>
      <label>Card number <input required placeholder="4242 4242 4242 4242" /></label>
      <label>Expiry <input required placeholder="12/28" /></label>
      <label>CVC <input required placeholder="123" /></label>
      <button type="submit">Submit Payment</button>
    </form>
  </section>
  <script src="/js/app.js"></script>
</body>
</html>
